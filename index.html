<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="author" content="Imani Bennett"/><meta name="description" content="Spots is an interactive photo-sharing website."/><meta name="keywords" content="social media, photo sharing, interactive media"/><title>Spots</title><script defer="defer" src="main.js"></script><link href="main.css" rel="stylesheet"></head><body><div class="page"><header class="header"><img src="d3610e9c6dce3cb370d8.svg" alt="Spots logo" class="header__logo"/></header><main class="content"><section class="profile page__section"><div class="profile__avatar-container"><img src="2fc47fd8e9a9bcd9612f.jpg" alt="Profile picture" class="profile__avatar"/> <button type="button" class="profile__avatar-edit-btn" aria-label="Edit profile picture"><img src="d38272e02bb4f1ab1c37.svg" alt="" class="profile__avatar-edit-icon"/> Edit Avatar</button></div><div class="profile__column"><h1 class="profile__name">Bessie Coleman</h1><p class="profile__description">Civil Aviator</p><button type="button" class="profile__edit-btn"><img src="d38272e02bb4f1ab1c37.svg" alt=""/> Edit Profile</button></div><button type="button" class="profile__add-btn"><img src="40608da7369d39bc1077.svg" alt=""/> New Post</button></section><section class="cards page__section"><ul class="cards__list"></ul></section><template id="card-template"><li class="card"><img class="card__image" src="" alt=""/> <button type="button" class="card__delete-button" aria-label="Delete card"></button><div class="card__content"><h2 class="card__title"></h2><button type="button" class="card__like-button" aria-label="Like card"></button></div></li></template></main><footer class="footer"><p class="footer__text">2025 &copy; Spots</p></footer><div class="modal" id="edit-profile-modal"><div class="modal__container"><button type="button" class="modal__close-btn" aria-label="Close modal"></button><h2 class="modal__title">Edit profile</h2><form class="modal__form"><label for="profile-name-input" class="modal__label">Name <input id="profile-name-input" class="modal__input" placeholder="Type your name" minlength="2" maxlength="40" required/> <span class="modal__error profile-name-input-error"></span></label> <label for="profile-description-input" class="modal__label">Description <input id="profile-description-input" class="modal__input" placeholder="Describe yourself" minlength="2" maxlength="200" required/> <span class="modal__error profile-description-input-error"></span></label> <button type="submit" class="modal__submit-btn">Save</button></form></div></div><div class="modal" id="new-post-modal"><div class="modal__container"><button type="button" class="modal__close-btn" aria-label="Close modal"></button><h2 class="modal__title">New post</h2><form class="modal__form"><label for="card-image-input" class="modal__label">Image link <input id="card-image-input" type="url" class="modal__input" placeholder="Place a link to the picture" required/> <span class="modal__error card-image-input-error"></span></label> <label for="card-caption-input" class="modal__label">Description <input id="card-caption-input" class="modal__input" placeholder="Type your caption" minlength="2" maxlength="30" required/> <span class="modal__error card-caption-input-error"></span></label> <button type="submit" class="modal__submit-btn">Post</button></form></div></div><div class="modal" id="preview-modal"><div class="modal__container modal__container_type_preview"><button type="button" class="modal__close-btn modal__close_type_image-preview" aria-label="Close modal"></button> <img class="modal__image" src="#" alt=""/><p class="modal__caption"></p></div></div><div class="modal" id="delete-modal"><div class="modal__container"><button type="button" class="modal__close-btn" aria-label="Close modal"></button><h2 class="modal__title">Are you sure?</h2><form class="modal__form"><button type="submit" class="modal__submit-btn">Yes, delete</button></form></div></div><div class="modal" id="edit-avatar-modal"><div class="modal__container"><button type="button" class="modal__close-btn" aria-label="Close modal"></button><h2 class="modal__title">Edit profile avatar</h2><form class="modal__form"><label for="avatar-link-input" class="modal__label">Profile Picture <input id="avatar-link-input" type="url" class="modal__input" placeholder="https://somewebsite.com/someimage.jpg" required/> <span class="modal__error avatar-link-input-error"></span></label> <button type="submit" class="modal__submit-btn">Save</button></form></div></div></div></body></html>
